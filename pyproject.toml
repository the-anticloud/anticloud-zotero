[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anticloud-ref"
version = "1.0.0"
description = "Anticloud Reference: convergent CRDTs, signed provenance, fail-closed licence policy, hash-pinned dependencies and a measurable performance harness."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Anticloud" }]
keywords = ["crdt", "provenance", "supply-chain", "licence-classification", "soc2", "fedramp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Version Control",
]

# One runtime dependency. No ML/accelerator stack is imported or permitted.
dependencies = ["cryptography>=42,<100"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
anticloud-ref = "anticloud_ref.cli:main"

[project.urls]
Documentation = "https://github.com/anticloud/anticloud-reference"
Source = "https://github.com/anticloud/anticloud-reference"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error"]
markers = [
    "slow: takes more than a second",
    "subprocess: spawns a child interpreter",
]

[tool.coverage.run]
branch = true
source = ["anticloud_ref"]

[tool.coverage.report]
show_missing = true
skip_covered = false
